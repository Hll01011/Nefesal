   <circle cx="17" cy="61" r="4" fill="#7e898e"/><circle cx="41" cy="61" r="4" fill="#7e898e"/><text x="29" y="27" text-anchor="middle" fill="#fff" font-size="8" font-family="Arial" font-weight="700">K2</text>
  </g>
  <g transform="translate(187 123)">
   <rect width="58" height="76" rx="4" fill="#dce1e4"/><rect x="7" y="8" width="44" height="25" rx="3" fill="#313c41"/><rect x="12" y="39" width="34" height="8" fill="#e30613"/>
