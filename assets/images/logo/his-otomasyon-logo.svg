<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">HİS Otomasyon Sistemleri</title>
  <desc id="desc">Elektrik panoları, kontaktörler ve endüstriyel otomasyon odaklı HİS logosu.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9d0d4"/><stop offset="1" stop-color="#7d878e"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263238"/><stop offset="1" stop-color="#0b1013"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b45"/><stop offset=".55" stop-color="#e30613"/><stop offset="1" stop-color="#a9000b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Panel / automation icon -->
  <g filter="url(#shadow)">
    <rect x="18" y="28" width="282" height="244" rx="18" fill="url(#metal)" stroke="#f8fafb" stroke-width="4"/>
    <rect x="38" y="48" width="242" height="204" rx="10" fill="url(#dark)" stroke="#59646a" stroke-width="3"/>
    <rect x="54" y="64" width="210" height="54" rx="6" fill="#11191d" stroke="#78848a" stroke-width="2"/>
    <circle cx="72" cy="91" r="7" fill="#e30613"/>
    <text x="88" y="88" fill="#f5f8f6" font-family="Arial,sans-serif" font-size="15" font-weight="700">HİS CONTROL</text>
    <text x="88" y="105" fill="#91a3a0" font-family="Arial,sans-serif" font-size="10">AUTO / PANEL 01</text>

    <!-- contactors -->
    <g stroke="#0a0d0f" stroke-width="2">
      <g transform="translate(56 132)">
        <rect width="58" height="82" rx="5" fill="#d9dee1"/>
        <rect x="7" y="8" width="44" height="29" rx="3" fill="#303b40"/>
        <rect x="12" y="44" width="34" height="9" rx="2" fill="#e30613"/>
        <circle cx="17" cy="66" r="4" fill="#8d989d"/><circle cx="41" cy="66" r="4" fill="#8d989d"/>
        <text x="29" y="31" text-anchor="middle" fill="#fff" font-size="8" font-family="Arial" font-weight="700">K1</text>
      </g>
      <g transform="translate(122 132)">
        <rect width="58" height="82" rx="5" fill="#d9dee1"/>
        <rect x="7" y="8" width="44" height="29" rx="3" fill="#303b40"/>
        <rect x="12" y="44" width="34" height="9" rx="2" fill="#e30613"/>
        <circle cx="17" cy="66" r="4" fill="#8d989d"/><circle cx="41" cy="66" r="4" fill="#8d989d"/>
        <text x="29" y="31" text-anchor="middle" fill="#fff" font-size="8" font-family="Arial" font-weight="700">K2</text>
      </g>
      <g transform="translate(188 132)">
        <rect width="58" height="82" rx="5" fill="#d9dee1"/>
        <rect x="7" y="8" width="44" height="29" rx="3" fill="#303b40"/>
        <rect x="12" y="44" width="34" height="9" rx="2" fill="#e30613"/>
        <circle cx="17" cy="66" r="4" fill="#8d989d"/><circle cx="41" cy="66" r="4" fill="#8d989d"/>
        <text x="29" y="31" text-anchor="middle" fill="#fff" font-size="8" font-family="Arial" font-weight="700">K3</text>
      </g>
    </g>

    <!-- terminals and wiring -->
    <g fill="#cbd2d5" stroke="#0a0d0f" stroke-width="2">
      <rect x="58" y="225" width="38" height="13" rx="2"/><rect x="102" y="225" width="38" height="13" rx="2"/>
      <rect x="146" y="225" width="38" height="13" rx="2"/><rect x="190" y="225" width="38" height="13" rx="2"/>
    </g>
    <g stroke="#e30613" stroke-width="3" fill="none">
      <path d="M74 132V120M140 132V120M206 132V120M74 214V225M140 214V225M206 214V225"/>
      <path d="M74 120H206"/>
    </g>
    <g fill="#f4c20d" stroke="#161a1d" stroke-width="2">
      <path d="M247 57h20l-10 19h10l-23 31 7-21h-10z"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(340 38)">
    <text x="0" y="118" fill="url(#metal)" font-family="Arial,sans-serif" font-size="128" font-weight="900" letter-spacing="-8">HİS</text>
    <path d="M174 20l42 0-22 42h28l-60 78 18-52h-30z" fill="url(#red)"/>
    <rect x="4" y="138" width="650" height="5" rx="2.5" fill="url(#red)"/>
    <text x="2" y="181" fill="#f5f8f6" font-family="Arial,sans-serif" font-size="37" font-weight="800" letter-spacing="3">OTOMASYON SİSTEMLERİ</text>
    <text x="4" y="218" fill="#91a3a0" font-family="Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="5">PANO • KONTAKTÖR • PLC • OTOMASYON</text>
  </g>
</svg>