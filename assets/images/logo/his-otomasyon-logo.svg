<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="t d">
<title id="t">HİS Otomasyon Sistemleri</title>
<desc id="d">Elektrik pano, kontaktör, PLC ve otomasyon sistemleri için HİS logosu.</desc>
<defs>
 <linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#c8ced2"/><stop offset="1" stop-color="#7c858b"/></linearGradient>
 <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263238"/><stop offset="1" stop-color="#080d10"/></linearGradient>
 <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4a52"/><stop offset=".5" stop-color="#e30613"/><stop offset="1" stop-color="#a9000b"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".45"/></filter>
</defs>

<!-- compact electrical cabinet -->
<g filter="url(#s)">
