  <rect x="53" y="217" width="42" height="15" rx="2"/><rect x="101" y="217" width="42" height="15" rx="2"/><rect x="149" y="217" width="42" height="15" rx="2"/><rect x="197" y="217" width="42" height="15" rx="2"/><rect x="245" y="217" width="42" height="15" rx="2"/>
 </g>
